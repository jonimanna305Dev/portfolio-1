    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        function generatePDF(type) {
            // 1. home.html থেকে তথ্য সংগ্রহ (DOM Data Extraction)
            const name = "Abid Islam";
            const title = "Senior Full-Stack Engineer & Software Architect";
            const email = "abid@example.com";
            const location = "San Francisco, CA";
            const website = "abidislam.dev";

            // About Section থেকে টেক্সট
            const aboutText = document.querySelector("#about p") ? document.querySelector("#about p").innerText : "";

            // Work Experience সংগ্রহ
            let experienceList = [];
            document.querySelectorAll("#work .card").forEach(card => {
                const role = card.querySelector("h4") ? card.querySelector("h4").innerText : "";
                const company = card.querySelector(".text-primary") ? card.querySelector(".text-primary").innerText : "";
                const years = card.querySelector(".badge") ? card.querySelector(".badge").innerText : "";
                const details = Array.from(card.querySelectorAll("li")).map(li => li.innerText);

                if (role) {
                    experienceList.push({ role, company, years, details });
                }
            });

            // Education সংগ্রহ
            let educationList = [];
            document.querySelectorAll("#education .card").forEach(card => {
                const degree = card.querySelector("h4") ? card.querySelector("h4").innerText : "";
                const institute = card.querySelector(".fw-medium") ? card.querySelector(".fw-medium").innerText : "";
                const years = card.querySelector(".badge") ? card.querySelector(".badge").innerText : "";
                const desc = card.querySelector("p") ? card.querySelector("p").innerText : "";

                if (degree) {
                    educationList.push({ degree, institute, years, desc });
                }
            });

            // Skills সংগ্রহ
            let skillsList = [];
            document.querySelectorAll("#skills .row-cols-lg-6 h6").forEach(skill => {
                skillsList.push(skill.innerText);
            });

            // 2. Dynamic PDF Layout/HTML তৈরি
            const pdfContainer = document.createElement("div");
            pdfContainer.style.padding = "30px";
            pdfContainer.style.fontFamily = "Arial, sans-serif";
            pdfContainer.style.color = "#333";
            pdfContainer.style.backgroundColor = "#fff";

            let pdfContent = `
        <div style="border-bottom: 2px solid #0d6efd; padding-bottom: 15px; margin-bottom: 20px;">
            <h1 style="margin: 0; color: #0d6efd; font-size: 28px;">${name}</h1>
            <h3 style="margin: 5px 0 10px 0; font-weight: normal; color: #555;">${title}</h3>
            <p style="margin: 0; font-size: 13px; color: #666;">
                Email: ${email} | Location: ${location} | Website: ${website}
            </p>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: #0d6efd; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Profile Summary</h3>
            <p style="font-size: 14px; line-height: 1.5;">${aboutText}</p>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: #0d6efd; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Work Experience</h3>
            ${experienceList.map(exp => `
                <div style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px;">
                        <span>${exp.role} - <span style="color: #0d6efd;">${exp.company}</span></span>
                        <span>${exp.years}</span>
                    </div>
                    <ul style="margin: 5px 0 0 20px; font-size: 13px;">
                        ${exp.details.map(d => `<li>${d}</li>`).join('')}
                    </ul>
                </div>
            `).join('')}
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: #0d6efd; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Education</h3>
            ${educationList.map(edu => `
                <div style="margin-bottom: 10px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                        <span>${edu.degree} (${edu.institute})</span>
                        <span>${edu.years}</span>
                    </div>
                    <p style="margin: 3px 0 0 0; font-size: 13px; color: #555;">${edu.desc}</p>
                </div>
            `).join('')}
        </div>

        <div>
            <h3 style="color: #0d6efd; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Technical Skills</h3>
            <p style="font-size: 13px; line-height: 1.6;">
                ${skillsList.join(' • ')}
            </p>
        </div>
    `;

            pdfContainer.innerHTML = pdfContent;

            // 3. PDF তৈরি এবং অটোমেটিক ডাউনলোড
            const opt = {
                margin: 0.5,
                filename: `${name.replace(/\s+/g, '_')}_${type.toUpperCase()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(pdfContainer).save();
        }
    </script>

    <script>

        document.querySelectorAll('#navbarNav .nav-link').forEach(link => {

                if (navbarNav.classList.contains('show')) {
                    new bootstrap.Collapse(navbarNav).hide();
                }

    <script>
    function initCounters(container = document) {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(({ isIntersecting, target: el }) => {
      if (!isIntersecting) return;

      const goal = +el.dataset.count;
      const suffix = el.innerText.replace(/[0-9]/g, '').trim(); // %, + ইত্যাদি আলাদা করবে
      let start;

      const run = time => {
        start = start || time;
        const progress = Math.min((time - start) / 2000, 1);
        el.innerText = Math.floor(progress * goal) + suffix;
        if (progress < 1) requestAnimationFrame(run);
      };

      requestAnimationFrame(run);
      obs.unobserve(el);
    });
  }, { threshold: 0.1 });

  container.querySelectorAll('.counter, [data-count]').forEach(c => obs.observe(c));
}
    </script>
